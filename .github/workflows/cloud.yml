name: Build the application on Docker and deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build With Buildx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest code
        uses: actions/checkout@v4

        #Initialize BuildX Engine
      - name: Initialize Buildx
        uses: docker/setup-buildx-actions@v3

        #Login to Docker Engine
      - name: Login Credentials
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Build And push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/news-app-ai:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max
  deploy:
    name:
