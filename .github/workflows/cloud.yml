name: Build the application on Docker and deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build With Buildx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest code
        uses: actions/checkout@v4

      # Initialize BuildX Engine
      - name: Initialize Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login Credentials
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Create the .env file from the GitHub Secret
      - name: Create Secret File
        run: echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # 2. Build and Push (Mounting the file we just created)
      - name: Build And push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          # FIXED: Point to the file (.env) we created in the previous step
          secrets: |
            env_file=.env
          tags: ${{ secrets.DOCKER_USERNAME }}/news-app-ai:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max

  deploy:
    name: Deploy To Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load Env Var
        run: |
          echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Deploy New Version
        run: |
          docker compose pull web_prod
          docker compose up -d web_prod
          docker image prune -f
