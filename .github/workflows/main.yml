name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: self-hosted

    steps:
      # Step 1: This pulls the code into the runner's workspace automatically
      # (You don't need to manually 'git pull' in a separate folder)
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Step 2: Create the .env file from secrets
      - name: 🔐 Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # Step 3: Run Docker Compose directly
      # We use the current directory (.) because checkout put the code here
      - name: 🐳 Docker Compose Up
        run: |
          # Shut down old containers if needed (optional but safer)
          docker compose down --remove-orphans

          # Start the new build
          docker compose up -d --build web_prod
