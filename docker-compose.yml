services:
  web_dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - database

  web_prod:
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
    depends_on:
      - database
    secrets:
      - postgres_password

  database:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=news_app
    volumes:
      - db_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
volumes:
  db_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
